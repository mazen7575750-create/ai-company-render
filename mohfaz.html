            answers: [cz.full, cz.full.toLowerCase(), (cz.affix || "").replace(/-/g, "")],
            correctDisplay: cz.full,
            field: "en",
            type: "cloze",
            cloze: cz
          });
          continue;
        }
        if (item.type === "verb") {
          for (const [label, form, arLabel] of [["inf", item.inf || item.en, "المصدر"], ["past", item.past, "الماضي"], ["pp", item.pp || item.past, "التصريف الثالث"]]) {
            const f = stripPos(form || "");
            if (f.length < 3) continue;
            const cz = makeClozePattern(f);
            if (!cz) continue;
            clozeQs.push({
              id: `q-${item.id}-cloze-${label}`,
              itemId: item.id,
              prompt: arPrompt(item) + " · " + arLabel,
              answers: [cz.full],
              correctDisplay: cz.full,
              field: "en",
              type: "cloze",
              cloze: cz
            });
          }
        } else {
          const enWord = stripPos(item.en || item.inf || item.target || "");
          if (enWord.length < 3 || /[\u0600-\u06FF]/.test(enWord)) continue;
          const target = enWord.trim();
          if (target.replace(/\s/g, "").length < 3) continue;
          // Derived words: blank only common suffixes (ly, ness, ment, tion, ...)
          const sufMatch = target.toLowerCase().match(/^(.*?)(ly|ness|ment|tion|sion|ful|less|able|ible|ous|ive|ance|ence|ship|hood|dom|er|est|ing|ed)$/);
          let cz = null;
          let prompt = arPrompt(item);
          if (sufMatch && sufMatch[1].length >= 3 && !target.includes(" ")) {
            const base = sufMatch[1];
            const suf = sufMatch[2];
            const full = target.toLowerCase();
            const chars = full.split("");
            const blankPositions = [];
            const pattern = chars.map((ch, i) => {
              if (i >= base.length && /[a-z]/.test(ch)) { blankPositions.push(i); return null; }
              return ch;
            });
            if (blankPositions.length) {
              cz = { pattern, answers: blankPositions.map((i) => chars[i]), full, blankPositions };
              prompt = arPrompt(item) || "أكمل";
            }
          }
          if (!cz) cz = makeClozePattern(target);
          if (!cz) continue;
          clozeQs.push({
            id: `q-${item.id}-cloze`,
            itemId: item.id,
            prompt: prompt,
            answers: [cz.full, cz.full.toLowerCase()],
            correctDisplay: cz.full,
            field: "en",
            type: "cloze",
            cloze: cz
          });
          // مضاد: حروف ناقصة للمضاد الإنجليزي مع سؤال عن معناه
          const ant = (item.antonym || "").trim();
          if (ant) {
            const antParts = ant.split(/[\/،,]/).map((s) => s.trim()).filter(Boolean);
            const antArArr = Array.isArray(item.antonymAr) ? item.antonymAr : [];
            antParts.forEach((ap, ai) => {
              if (ap.length < 3 || /[\u0600-\u06FF]/.test(ap)) return;
              const czAnt = makeClozePattern(ap);
              if (!czAnt) return;
              const antPrompt = antArArr[ai] || antArArr[0] || displayAr(item) || target;
              clozeQs.push({
                id: `q-${item.id}-cloze-ant-${ai}`,
                itemId: item.id,
                prompt: antPrompt,
                answers: [czAnt.full, czAnt.full.toLowerCase()],
                correctDisplay: czAnt.full,
                field: "en",
                type: "cloze",
                cloze: czAnt
              });
            });
          }
        }
      }
      const finalCloze = settings.order === "random" ? shuffle(clozeQs) : clozeQs;
      return finalCloze;
    }

    // --- Contextual sentence multiple choice ---
    if (settings.method === "listen") {
      const listenQs = [];
      for (const item of ordered) {
        if (item.type === "affix") continue;
        const enWord = stripPos(item.en || item.inf || item.target || "");
        if (!enWord || /[\u0600-\u06FF]/.test(enWord)) continue;
        const def = String(item.definition || "").trim();
        const hasDef = def && !/[\u0600-\u06FF]/.test(def);
        // ينطق التعريف إن وُجد، وإلا الكلمة/المصدر
        const speakText = hasDef ? def : (item.type === "verb" ? stripPos(item.inf || item.en || "") : enWord);
        if (!speakText || speakText.replace(/\s/g, "").length < 2) continue;
        const ars = arList(item);
        const wordAns = item.type === "verb" ? stripPos(item.inf || item.en || "") : enWord;
        const allAns = allEnglish(item).length ? allEnglish(item) : [wordAns];
        if (!allAns.some((a) => normalizeEn(a) === normalizeEn(wordAns))) allAns.unshift(wordAns);
        listenQs.push({
          id: `q-${item.id}-listen`,
          itemId: item.id,
          prompt: hasDef ? "🔊 اسمع التعريف واكتب الكلمة" : "🔊 اسمع واكتب ما تسمعه",
          answers: allAns,
          correctDisplay: wordAns,

          speakText: speakText,

        });

      const finalListen = settings.order === "random" ? shuffle(listenQs) : listenQs;
      return finalListen;
    }

    if (settings.method === "reveal") {
      for (const item of ordered) {
        const dir = settings.direction === "mixed"
          ? (Math.random() < 0.5 ? "ar-en" : "en-ar")
          : settings.direction;
        if (item.type !== "sentence" && !(item.inf || item.en || item.target)) continue;
        const ars = arList(item);
        const enD = displayEn(item);
        const mainWord = stripPos(item.en || item.inf || item.target || "");
        const isAffixReveal = item.type === "affix";
        const affixNote = isAffixReveal ? (item.note || ars.join(" / ") || "") : "";
        const affixExArr = isAffixReveal ? (item.examples || []) : [];
        const affixExStr = affixExArr.join(" / ");
        const fixedForR = fixAffixEn(item.en||"", item.examples||[]);
        const cleanAffixR = fixedForR.replace(/-/g,"");
        const spacedR = isAffixReveal ? cleanAffixR.split("").join(" ").toUpperCase() : "";
        let fields = [];
        if (item.type === "verb") {
          // تسميع الكشف: ثلاث خانات حسب الجدول
          fields.push({ key: "inf", label: "المصدر", value: stripPos(item.inf || item.en || "") });
          fields.push({ key: "past", label: "الماضي", value: stripPos(item.past || "") });
          fields.push({ key: "pp", label: "التصريف الثالث", value: stripPos(item.pp || "") });
        } else if (isAffixReveal) {
          // معكوس حسب طلب المستخدم: السؤال = -ence في confidence، اللي ورا العين = تكون الاسم من الصفة
          const affixOnly = fixAffixEn(item.en||"", item.examples||[]);
          const arabicFunc = affixNote || ars.join(" / ") || "";
          // خانة واحدة بس للوظيفة (مش مكررة)
          fields.push({ key: "ar", label: "\u0627\u0644\u0648\u0638\u064A\u0641\u0629", value: arabicFunc });
        } else {
          if (dir === "ar-en") {
            if (enD) fields.push({ key: "en", label: "\u0627\u0644\u0645\u0639\u0646\u0649 / \u0627\u0644\u0645\u0631\u0627\u062F\u0641\u0627\u062A \u0628\u0627\u0644\u0625\u0646\u062C\u0644\u064A\u0632\u064A", value: enD });
          }
          if (dir === "en-ar") {
            if (ars.length) fields.push({ key: "ar", label: "\u0627\u0644\u062A\u0631\u062C\u0645\u0629", value: ars.join(" / ") });
          }
        }
        const antArValues = Array.isArray(item.antonymAr) ? item.antonymAr : (item.antonymAr ? [item.antonymAr] : []);
        let prompt;
        if (isAffixReveal) {
          // السؤال = -ence في confidence (من غير  ايه)
          const fixedPromptEn = fixAffixEn(item.en||"", item.examples||[]);
          // لا تُعرض الترجمة العربية لأمثلة اللواحق في أي تسميع
          const exDisplay = (item.examples||[]).filter(Boolean).join(" / ") || affixExStr || "";
          if (exDisplay) {
            prompt = `${fixedPromptEn} في ${exDisplay}`;
          } else {
            prompt = `${fixedPromptEn}`;
          }
        } else {
          const defEn = (item.definition || "").trim();
          const hasDef = defEn && !/[\u0600-\u06FF]/.test(defEn);
          if (hasDef) {
            prompt = defEn;
            fields.length = 0;
            fields.push({ key: "en", label: "الكلمة", value: enD || mainWord || "—" });
          } else if (item.type === "verb") {
            // فعل: السؤال بالعربي + ثلاث خانات التصريف (لا تُمسَح)
            prompt = ars.join(" / ") || "—";
            // fields already set: المصدر / الماضي / التصريف الثالث
          } else if (dir === "en-ar") {
            prompt = enD || item.inf || item.en || "—";
            if (ars.length) {
              fields.length = 0;
              fields.push({ key: "ar", label: "المعنى", value: ars.join(" / ") });
            }
          } else {
            prompt = ars.join(" / ") || item.sentence || "—";
            fields.length = 0;
            if (enD || mainWord) fields.push({ key: "en", label: "الكلمة", value: enD || mainWord });
          }
          // منع أي تكرار: لا تدفع definition كحقل
          for (let fi = fields.length - 1; fi >= 0; fi--) {
            if (fields[fi].key === "def" || fields[fi].value === defEn) fields.splice(fi, 1);
          }
          // إضافة المضاد بعد تحديد الإجابة الأساسية، حتى لا يُحذف عند إعادة ضبط الحقول.
          if ((item.antonym || "").trim()) fields.push({ key: "ant", label: "المضاد بالإنجليزي", value: item.antonym.trim() });
          if (antArValues.length) fields.push({ key: "antAr", label: "المعنى العربي للمضاد", value: antArValues.join(" / ") });
          // إزالة تكرار القيم المتطابقة فقط، مع إبقاء المضاد ومعناه في خانتين منفصلتين.
          const seenV = new Set();
          fields = fields.filter((f) => {
            const k = (f.key || "") + "|" + (f.value || "").toString();
            if (seenV.has(k)) return false;
            seenV.add(k);
            return true;
          });
        }
        if (fields.length > 0) {
          questions.push({
            id: `q-${item.id}-reveal`,
            itemId: item.id,
            prompt,
            answers: [enD, ...ars],
            correctDisplay: fields.map((f) => `${f.label}: ${f.value}`).join(" \xB7 "),
            field: "reveal",
            type: "reveal",
            revealFields: fields
          });
        }
        // definition handled once in main reveal prompt — no second card

      }
      return settings.order === "random" ? shuffle(questions) : questions;
    }
    for (const item of ordered) {
      const ars = arList(item);
      // في الوضع المختلط: اختر عشوائيًا اتجاهًا واحدًا لكل عنصر (≈50% عربي→إنجليزي و50% إنجليزي→عربي)
      const dir = settings.direction === "mixed"
        ? (Math.random() < 0.5 ? "ar-en" : "en-ar")
        : settings.direction;
      if (item.type !== "sentence" && !(item.inf || item.en || item.target)) continue;
      if (item.type === "sentence" && !(item.sentence || item.en)) continue;
      if (item.type === "affix") {
        let enA = item.en || item.inf || "";
        const note = item.note || arList(item).join(" / ") || "";
        const exArr = item.examples || [];
        const ex = exArr.join(" / ");
        const fixedEnA = fixAffixEn(enA, exArr);
        enA = fixedEnA;
        const cleanAffix = fixedEnA.replace(/^-/, "").replace(/-$/, "").toLowerCase();
        const firstEx = exArr[0] || "";
        // أمثلة إنجليزي فقط — بدون عربي المثال في السؤال
        const exDisplayChoice = exArr.filter(Boolean).join(" / ") || ex;
        // معكوس: السؤال = -ence في confidence، الجواب = تكون الاسم من الصفة - خانة واحدة بس
        if (true) {
          let promptAffix = "";
          if (exDisplayChoice) {
            promptAffix = `${enA} في ${exDisplayChoice}`;
          } else {
            promptAffix = `${enA}`;
          }
          questions.push({
            id: `q-${item.id}-affix-ar`,
            itemId: item.id,
            prompt: promptAffix,
            answers: [note, ...arList(item)].filter(Boolean),
            correctDisplay: note || arList(item).join(" / "),
            field: "ar",
            type: "affix"
          });
        }
        continue;
      }
      if (item.type === "verb") {
        if (dir === "ar-en") {
          questions.push({
            id: `q-${item.id}-conj`,

            correctDisplay: fullConj(item),

            type: "verb",
            // strict order for write mode
            orderedParts: [item.inf, item.past || item.inf, item.pp || item.past || item.inf]
          });
        }
        if (dir === "en-ar") {
          if (false) {
            for (const oneAr of ars) {
              questions.push({
                id: `q-${item.id}-ar-${oneAr}`,
                itemId: item.id,
                prompt: item.inf,
                answers: [oneAr],
                correctDisplay: oneAr,
                field: "ar",

              });

          } else {
            questions.push({
              id: `q-${item.id}-ar`,
              itemId: item.id,
              prompt: item.inf,
              answers: ars,
              correctDisplay: ars.join(" / "),
              field: "ar",
              type: "verb"
            });
          }
        }
      } else if (item.type === "sentence") {
        if (dir === "en-ar") {
          questions.push({
            id: `q-${item.id}-sent-ar`,
            itemId: item.id,
            prompt: item.sentence || item.en,
            answers: arList(item),
            correctDisplay: arList(item).join(" / "),
            field: "ar",
            type: "sentence"
          });
        }
        if (dir === "ar-en") {
          questions.push({
            id: `q-${item.id}-sent-en`,
            itemId: item.id,
            prompt: item.ar && arList(item).join(" / ") || item.hint || "\u0623\u0643\u0645\u0644 / \u062A\u0631\u062C\u0645",
            answers: [item.en || item.target || ""],
            correctDisplay: item.en || item.target || "",
            field: "en",
            type: "sentence"
          });
        }
      } else {
        const enWord = stripPos(item.en || item.inf || "");
        const def = (item.definition || "").trim();
        const syns = Array.isArray(item.synonyms) ? item.synonyms.map(stripPos).filter(Boolean) : [];
        const allEn = allEnglish(item);
        const enDisplay = displayEn(item);
        if (dir === "en-ar") {
          if (false) {
            for (const oneAr of ars) {
              questions.push({
                id: `q-${item.id}-ar-${oneAr}`,
                itemId: item.id,
                prompt: enWord,
                answers: [oneAr],
                correctDisplay: oneAr,
                field: "ar",
                type: "word"
              });
            }
          } else {
            questions.push({
              id: `q-${item.id}-ar`,
              itemId: item.id,
              prompt: enWord,
              answers: ars,
              correctDisplay: ars.join(" / "),
              field: "ar",
              type: "word"
            });
          }
        }
        if (dir === "ar-en") {
          if (false) {
            for (const oneAr of ars) {
              questions.push({
                id: `q-${item.id}-en-${oneAr}`,
                itemId: item.id,
                prompt: oneAr,
                answers: allEn,

              });

          } else if (ars.length) {
            questions.push({
              id: `q-${item.id}-en`,
              itemId: item.id,
              prompt: ars.join(" / "),
              answers: allEn,
              correctDisplay: enDisplay,
              field: "en",
              type: "word"
            });
          }
          if (def) {
            questions.push({
              id: `q-${item.id}-def`,
              itemId: item.id,
              prompt: def,
              answers: [enWord, ...syns],
              correctDisplay: enWord,
              field: "en",
              type: "definition"
            });
          }
        }
        const ant = (item.antonym || "").trim();
        if (ant) {
          const antParts = ant.split(/[\/،,]/).map((s) => s.trim()).filter(Boolean);
          const antAr = Array.isArray(item.antonymAr) ? item.antonymAr.filter(Boolean) : (item.antonymAr ? [String(item.antonymAr)] : []);
          if (dir === "ar-en") {
            // 1) معنى الكلمة بالعربي · مضاد بالإنجليزي؟ → unimportant
            if (ars[0] || enWord) {
              questions.push({
                id: `q-${item.id}-ant-from-word`,
                itemId: item.id,
                prompt: (ars[0] || enWord) + " · المضاد بالإنجليزي؟",
                answers: antParts,
                correctDisplay: antParts.join(" / "),
                field: "antonym",
                type: "word"
              });
            }
            // 2) معنى المضاد بالعربي فقط → unimportant
            if (antAr.length) {
              questions.push({
                id: `q-${item.id}-ant-ar-to-en`,
                itemId: item.id,
                prompt: antAr[0],
                answers: antParts,
                correctDisplay: antParts.join(" / "),
                field: "antonym",
                type: "word"
              });
            }
          }
          if (dir === "en-ar") {
            // الكلمة الإنجليزية · المضاد؟ → معناه بالعربي أو المضاد حسب المطلوب
            questions.push({
              id: `q-${item.id}-ant-en`,
              itemId: item.id,
              prompt: enWord + " · المضاد؟",
              answers: antAr.length ? antAr : antParts,
              correctDisplay: antAr.length ? antAr.join(" / ") : ant,
              field: antAr.length ? "antonymAr" : "antonym",
              type: "word"
            });
            if (antAr.length && antParts.length) {
              questions.push({
                id: `q-${item.id}-ant-en-to-ar`,
                itemId: item.id,
                prompt: antParts[0] + " · معناه بالعربي؟",
                answers: antAr,
                correctDisplay: antAr.join(" / "),
                field: "antonymAr",
                type: "word"
              });
            }
          }
        }
      }
    }
    let finalQs = settings.order === "random" ? shuffle(questions) : questions;

    // Typo Fixer: show text with a typo — user writes the FULL corrected word
    // Exception: prefixes/suffixes → write only the affix; verb forms → write the full corrected single form
    if (settings.method === "typo") {
      const typoQs = [];
      // Affix items: typo on the affix letters only — answer is the affix (or letters)
      for (const item of ordered) {
        if (item.type !== "affix") continue;
        const aff = fixAffixEn(item.en || "", item.examples || []);
        const letters = aff.replace(/-/g, "");
        const ex = (item.examples && item.examples[0]) || "";
        const func = (item.note || displayAr(item) || "").trim() || "صحّح اللاحقة/السابقة";
        if (letters.length < 2 && !ex) continue;
        let shownWord = "";
        let answers = [];
        if (ex && letters.length >= 2) {
          const isSuffix = aff.startsWith("-");
          let brokenAff = makeTypo(letters);
          if (brokenAff.toLowerCase() === letters.toLowerCase()) {
            brokenAff = letters.split("").reverse().join("") || (letters + "x");
          }
          if (isSuffix && new RegExp(letters + "$", "i").test(ex)) {
            shownWord = ex.slice(0, ex.length - letters.length) + brokenAff;
          } else if (!isSuffix && new RegExp("^" + letters, "i").test(ex)) {
            shownWord = brokenAff + ex.slice(letters.length);
          } else {
            shownWord = ex.replace(new RegExp(letters, "i"), brokenAff);
          }
          // الإجابة = اللاحقة/السابقة فقط
          answers = [aff, letters, aff.replace(/-/g, "")];
        } else {
          let broken = makeTypo(letters);
          if (broken.toLowerCase() === letters.toLowerCase()) broken = letters.split("").reverse().join("") || letters + "x";
          shownWord = aff.startsWith("-") ? ("-" + broken) : (broken + (aff.endsWith("-") ? "-" : ""));
          answers = [aff, letters];
        }
        typoQs.push({
          id: `q-${item.id}-typo-aff`,
          itemId: item.id,
          prompt: func + "\n" + shownWord,
          answers,
          correctDisplay: aff,
          field: "en",
          type: "typo",
          typoPartial: true
        });
      }
      for (const q of finalQs) {
        // لا تُضمّن أسئلة التعريفات في تسميع التصحيح الإملائي
        if (q.type === "definition" || q.field === "def") continue;
        const target = (q.correctDisplay || (q.answers && q.answers[0]) || "").trim();
        if (!target || /[\u0600-\u06FF]/.test(target)) continue;
        // تخطّي الإجابات العربية أو الوظائف العربية
        if (q.field === "ar" || q.field === "antonymAr") continue;

        // Verb conjugation: typo ONE form — answer is the FULL corrected form of that one word
        if (q.field === "conj" || (target.match(/\//g) || []).length >= 2) {
          const parts = target.split("/").map((s) => s.trim()).filter(Boolean);
          if (parts.length < 2) continue;
          const badIdx = parts.length >= 3 ? (1 + Math.floor(Math.random() * (parts.length - 1))) : Math.floor(Math.random() * parts.length);
          const originalPart = parts[badIdx];
          if (originalPart.length < 2) continue;
          let brokenPart = makeTypo(originalPart);
          if (brokenPart.toLowerCase() === originalPart.toLowerCase()) brokenPart = originalPart + "e";
          const displayParts = parts.map((p, i) => i === badIdx ? brokenPart : p);
          typoQs.push({
            ...q,
            id: q.id + "-typo",
            prompt: displayParts.join(" / "),
            answers: [originalPart],
            correctDisplay: originalPart,
            field: "en",
            type: "typo",
            typoOriginal: brokenPart,
            typoIndex: badIdx,
            typoPartial: false
          });
          continue;
        }

        // Pure affix display (starts/ends with -): answer = the affix only
        if (target.startsWith("-") || target.endsWith("-")) {
          const letters = target.replace(/-/g, "");
          if (letters.length >= 2) {
            let broken = makeTypo(letters);
            if (broken.toLowerCase() === letters.toLowerCase()) broken = letters.slice(0, -1) + (letters.slice(-1) === "e" ? "a" : "e");
            const shown = target.startsWith("-") ? ("-" + broken) : (broken + "-");
            typoQs.push({
              ...q,
              id: q.id + "-typo",
              prompt: shown,
              answers: [target, letters],
              correctDisplay: target,
              field: "en",
              type: "typo",
              typoOriginal: shown,
              typoPartial: true
            });
            continue;
          }
        }

        // Single or multi-word: show typo of the full target, answer = full correct word/phrase

        throw new Error("نوع الملف غير مدعوم. استخدم صورة أو PDF.");
      }

        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));

        reader.onabort = () => reject(new Error("تم إلغاء قراءة الملف"));

          signal.addEventListener("abort", () => { try { reader.abort(); } catch (_) {} }, { once: true });
        }
        reader.readAsDataURL(file);
      });
      const comma = dataUrl.indexOf(",");
      if (comma < 0) throw new Error("تعذر تجهيز الملف للقراءة");

      if (!base64) throw new Error("الملف فارغ أو تعذرت قراءته");

          { inline_data: { mime_type: mimeType, data: base64 } }
        ] }],
        generationConfig: { temperature: 0.1, maxOutputTokens: 8192, responseMimeType: "application/json" }
      };
      const response = await aiFetch(requestBody, signal, model, "extract");

    }
